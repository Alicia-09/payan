<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descuento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">

</head>

<body>

    <section class="inicio text-white">

    <div class="container py-5">

        <div class="row">
            <div class="col-12 text-center mb-5">

                <h1 class="display-3 fw-bold">
                    17% DE DESCUENTO
                    <br>
                    EN TODA LA TIENDA
                </h1>

                <p class="lead mt-3">
                    Aprovecha nuestra promocion y ahorra en tus compras.
                </p>

            </div>
        </div>


        <div class="row align-items-center g-5">

            <div class="col-lg-6 text-center">

                <img
                    src="descuento.png"
                    class="img-fluid rounded-4 imagen-descuento"
                    alt="17% de descuento">

            </div>


            <div class="col-lg-6">

                <div class="card tarjeta-descuento border-0 rounded-4">

                    <div class="card-body p-4 p-md-5">

                        <h2 class="text-center fw-bold text-dark mb-3">
                            Calcula tu descuento
                        </h2>

                        <p class="text-center text-secondary mb-4">
                            Introduce el total de tu compra
                            y descubre cuanto pagaras.
                        </p>


                        <form action="descuento.php" method="GET">

                            <div class="mb-4">

                                <label
                                    for="compra"
                                    class="form-label fw-semibold text-dark">

                                    Cantidad total de compra:

                                </label>

                                <input
                                    type="number"
                                    id="compra"
                                    name="compra"
                                    class="form-control"
                                    placeholder="Ejemplo: 1500"
                                    required>

                            </div>


                            <button
                                type="submit"
                                class="btn boton-descuento btn-lg w-100">

                                Calcular descuento

                            </button>

                            <p class="texto-condicion text-center mt-3 mb-0 ">
                                El descuento aplica solamente en compras
                                mayores a $1,250.
                            </p>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

</body>

</html>
